name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译 + 单元测试 + 打包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Paper 26.2 要求 Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle 构建（编译 + 单元测试 + 打 jar）
        run: ./gradlew --no-daemon --stacktrace --warning-mode summary clean build printBuildInfo

      - name: 列出产物
        run: ls -lh build/libs

      - name: 校验 jar 内容（plugin.yml / 主类 / 配置）
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | head -n 1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | tee /tmp/jar-list.txt
          grep -q 'plugin.yml' /tmp/jar-list.txt
          grep -q 'config.yml' /tmp/jar-list.txt
          grep -q 'BattledXuanjianPlugin.class' /tmp/jar-list.txt
          unzip -p "$JAR" plugin.yml

      - name: 上传插件 jar
        uses: actions/upload-artifact@v4
        with:
          name: BattledXuanjian-plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore

  smoke:
    name: Paper 26.2 服务端冒烟 + 插件自检
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: BattledXuanjian-plugin-jar
          path: ci/jar

      - name: 运行 Paper 服务端冒烟测试与插件自检
        run: bash ci/smoke-test.sh

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-server-log
          path: |
            ci/run/server.log
            ci/run/plugins/BattledXuanjian/*.yml
          if-no-files-found: ignore
