# ============================================================
#  玄剑·战争 BattledXuanjian 配置文件
#  Paper 26.2+ / Java 25
#  所有关键参数均可热重载：/bx reload
# ============================================================

# ---------------- 基础设置 ----------------
game:
  min-players: 4                 # 最少人数，低于该人数无法开局
  countdown: 30                  # 开始倒计时（秒）
  time-limit: 0                  # 0 表示无时间限制；否则时间到守方（C军）获胜（单位：分钟）
  allow-mid-join: true           # 允许中途加入
  auto-balance: true             # 自动平衡人数（中途加入时优先补人少的一方）
  auto-next-round: false         # 本局结束后是否自动进入下一局倒计时
  # 等待区大厅坐标（可由 /bx lobby set 设置，world 为空表示未设置）
  lobby:
    world: ""
    x: 0.0
    y: 64.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

# ---------------- 兵力设置 ----------------
reinforcements:
  M: 50                          # 攻方（M军）初始公共复活次数
  C: -1                          # 守方（C军）-1 表示无限

# ---------------- 重生设置 ----------------
respawn:
  delay: 5                       # 重生等待秒数
  min-distance: 20               # 重生点与死亡点最小距离（格）
  safe-search-attempts: 32       # 在死亡点附近寻找安全落点的最大尝试次数

# ---------------- 据点占领设置 ----------------
capture:
  base-time: 15                  # 基础占领/脱离时间（秒，单人时）
  speed-per-player: 0.5          # 每多一名玩家，速度增加比例（1 人时为基础速度，2 人为 1.5 倍…）
  update-interval-ticks: 10      # 占领逻辑刷新间隔（刻），10 刻 = 0.5 秒
  bossbar:
    visible-to-all: true         # 据点 BossBar 对所有玩家可见

# ---------------- 队伍显示设置 ----------------
teams:
  C:
    name: "C军"
    color: "§9"                  # 蓝色（守方）
    prefix: "§9[C] "
  M:
    name: "M军"
    color: "§c"                  # 红色（攻方）
    prefix: "§c[M] "
  hide-enemy-nametag: true       # 隐藏敌方头顶名字（原版 Scoreboard Team 实现）
  hide-enemy-tab: true           # 隐藏敌方 Tab 名字（需要 ProtocolLib，缺失时自动降级并告警）
  tab-mask: "§k"                 # Tab 遮挡前缀（&k 为乱码字符，可改为空字符串表示空白）
  chat-mode: GLOBAL              # GLOBAL = 全服可见（前缀区分）；TEAM_ONLY = 仅同阵营可见
  friendly-fire: false           # 友军伤害开关（false = 关闭友军伤害）
  sync-vanilla-team-command: true # 监听原版 /team 指令并自动同步回本插件的队伍设置

# ---------------- 装备包设置 ----------------
kits:
  prevent-enemy-pickup: true     # 禁止拾取敌方阵营装备
  prevent-drop: true             # 禁止丢弃本阵营装备包物品
  clear-effects-on-respawn: true # 重生时清除药水效果

# ---------------- 侧边栏 ----------------
sidebar:
  enabled: true
  title: "§6玄剑·战争"
  lines:
    time: "§f时间: §a{time}"
    reinforcements: "§f攻方兵力: §c{count}"
    point-owned: "§f据点 {point}: {color}{side}军"
    point-neutral: "§f据点 {point}: §7无主"
    point-contesting: "§f据点 {point}: {color}争夺中 {progress}%"
    footer: "§7/bx help 查看指令"

# ---------------- 宣告设置 ----------------
broadcast:
  chat: true
  title: true
  actionbar: true
  sound: true
  bossbar: true
  sidebar: true
  sounds:
    countdown: "block.note_block.hat"
    start: "entity.player.levelup"
    capture: "block.note_block.pling"
    decapture: "block.note_block.bass"
    victory: "ui.toast.challenge_complete"
    defeat: "entity.villager.no"

# ---------------- 统计与存储 ----------------
stats:
  persist: true                  # 是否把累计统计写入 stats.yml
  file: "stats.yml"

storage:
  points-file: "points.yml"      # 据点、选区、出发点、大厅坐标
  items-file: "items.yml"        # 阵营装备包

